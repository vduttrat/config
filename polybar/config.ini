[colors]
background = #111219
background-alt = #45475a
foreground = #cdd6f4
primary = #f38ba8
secondary = #8ABEB7
alert = #f38ba8
disabled = #6c7086
custom = #89b4fa

[bar/example]
width = 100%
height = 30pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-top-size=4
border-left-size=7
border-right-size=7
border-bottom-size=2
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = 0xProtoNerdFont:size=16;5

modules-left = xworkspaces xwindow
modules-right = eth wlan filesystem pulseaudio battery date time systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

bottom = false

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 2pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.custom}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %instance:0:50:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#89b4fa}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>

label-volume = %{F#89b4fa}VOL %{F#cdd6f4}%percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
label = %{F#a6e3a1}CPU %{F#cdd6f4}%percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#89b4fa} %{F-} %essid% 
label-disconnected = ""

# %{F#f38ba8} %{F#707880} ---

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#f38ba8}%ifname%%{F-} %local_ip%
label-disconnected = ""

[module/time]
type = internal/date
interval = 1

time = %I : %M

label = %time%
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1

date = %d %b

label = %date%
label-foreground = ${colors.foreground}


[settings]
screenchange-reload = true
pseudo-transparency = true

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5

low-at = 15
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <animation-low> <label-low>

label-charging = %{F#a6e3a1}Charging %{F#cdd6f4}%percentage%%
label-discharging = %{F#89b4fa}BAT %{F#cdd6f4}%percentage%%
label-full = %{F#89b4fa}BAT %{F#cdd6f4}%percentage%%
label-low = %{F#ff5555}BAT %{F#cdd6f4}%percentage%%

animation-low-0 = "!"
animation-low-1 =  " "
animation-low-framerate = 200

